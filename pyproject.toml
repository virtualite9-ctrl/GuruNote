[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gurunote"
version = "0.1.0"
description = "로컬 STT + LLM 기반 영상 노트 도구"
requires-python = ">=3.10"

# 본 항목은 setup.sh / setup.bat 가 사용하는 requirements*.txt 와 별 trajectory.
# requirements*.txt 가 플랫폼별 (gpu/mac) + 기능별 (notion/pdf/search) 분리되어
# 있으므로 pyproject.toml 은 (1) pyyaml 같은 런타임 누락 의존성 catch (2) dev
# 의존성 (pytest) 등록 용도만 진행.
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
# UI 없이 파이프라인을 돌리는 진입점. 사람이 터미널에서, 에이전트가 --json 으로 쓴다.
gurunote = "gurunote.cli:main"
# MCP 서버 (stdio). mcp 패키지가 필요하므로 [mcp] extra 를 함께 설치해야 한다.
gurunote-mcp = "gurunote.mcp_server:main"

[project.optional-dependencies]
# MCP 서버용. 에이전트 연동을 안 쓰면 설치할 필요가 없다.
#
# yt-dlp 가 들어 있는 이유: `gurunote.audio` 가 모듈 레벨에서 import 하고,
# mcp_server → jobs → pipeline → audio 로 이어져 서버가 뜰 때 반드시 필요하다.
# 이것 없이 `pip install -e ".[mcp]"` 만 하면 서버가 ModuleNotFoundError 로 죽는다.
mcp = [
    "mcp>=2.0",
    "yt-dlp>=2024.3.10",
]

dev = [
    "pytest>=9.0",
    # tests/test_xgrammar_healthcheck.py 가 `patch("openai.OpenAI")` 로 클라이언트를
    # 모킹한다. 실제 호출은 하지 않지만 patch 대상 문자열을 해석하려면 모듈이
    # import 가능해야 하므로 test 의존성이다.
    "openai>=1.30",
    # gurunote.audio 가 모듈 레벨에서 yt_dlp 를 import 하고,
    # gurunote.pipeline_worker 가 그 모듈을 끌어온다. import 검사에 필요하다.
    "yt-dlp>=2024.3.10",
    # gui.py 가 모듈 레벨에서 dotenv 를 import 한다. 진입점 import 검사에 필요하다.
    "python-dotenv>=1.0",
    # MCP 도구 등록·호출을 테스트에서 실제로 확인한다.
    "mcp>=2.0",
]

# pytest 설정은 pytest.ini 가 source-of-truth (중복 방지).

# flat-layout 자동 탐색은 `verify_results/` (검증 보고서 100여 개가 든 데이터
# 디렉토리) 까지 top-level 패키지 후보로 보고 "Multiple top-level packages
# discovered" 로 빌드를 거부한다. 실제 배포 대상은 gurunote 와 그 하위
# 패키지뿐이므로 명시적으로 한정한다. 이것이 없으면 `pip install -e .` 자체가
# 실패한다.
[tool.setuptools.packages.find]
include = ["gurunote*"]
